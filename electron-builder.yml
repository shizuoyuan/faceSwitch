appId: com.faceswitch.app
productName: FaceSwitch
artifactName: FaceSwitch-${version}-win.${ext}
directories:
  # C 盘项目树内有内核过滤驱动(ahflt)抢锁新写文件, 打包输出必须放 D 盘
  output: D:/FaceSwitch-release
  buildResources: build
files:
  - out/**
  - package.json
  - '!node_modules/**'
asar: true
extraResources:
  - from: engine/dist/engine
    to: engine
  - from: models
    to: models
  # 本地生图服务脚本 (由机器上的 venv Python 运行, torch 不打进包)
  - from: engine/sd_server
    to: sd_server
    filter:
      - '**/*'
      - '!**/__pycache__/**'
win:
  icon: build/icon.ico
  target:
    - target: zip
      arch:
        - x64
