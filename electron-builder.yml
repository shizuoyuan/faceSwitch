appId: com.faceswitch.app
productName: FaceSwitch
artifactName: FaceSwitch-${version}-win.${ext}
directories:
  # C 盘项目树内有内核过滤驱动(ahflt)抢锁新写文件, 打包输出必须放 D 盘
  output: D:/FaceSwitch-release
  buildResources: build
files:
  - out/**
  - package.json
  - '!node_modules/**'
asar: true
extraResources:
  - from: engine/dist/engine
    to: engine
  - from: models
    to: models
win:
  icon: build/icon.ico
  target:
    - target: zip
      arch:
        - x64
